<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AstroVR · Astronaut</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%95%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
      canvas { display: block; }
      [hidden] { display: none !important; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #000; color: #e8eef7; font: 600 18px/1.4 system-ui, sans-serif; text-align: center; padding: 24px;
        z-index: 2;
      }
      #start {
        font: 800 32px system-ui, sans-serif; letter-spacing: 0.08em; color: #000; background: #ffc847;
        border: 0; border-radius: 999px; padding: 22px 64px;
      }
      #start:disabled { background: #444; color: #aaa; }
      #banner, #banner2 {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3;
        background: #b3261e; color: #fff; padding: 6px 14px; border-radius: 8px; font: 600 14px system-ui, sans-serif;
      }
      #banner2 { display: none; }
      body.stereo #banner { left: 25%; top: 30%; }
      body.stereo #banner2 { display: block; left: 75%; top: 30%; }
      body.stereo #banner2[hidden] { display: none; }
      #lens { display: flex; align-items: center; gap: 12px; font: 600 15px system-ui, sans-serif; color: #9fb0c4; }
      #lens button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3a4a5e; background: #111a26; color: #fff; font: 700 22px system-ui; }
      #lensMm { min-width: 70px; color: #fff; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <p id="info"></p>
      <button id="start" disabled>…</button>
      <div id="lens"><span id="lensLabel">VR box lens distance</span>
        <button id="lensMinus" aria-label="-">−</button><span id="lensMm">62 mm</span><button id="lensPlus" aria-label="+">+</button>
      </div>
    </div>
    <div id="banner" hidden></div>
    <script type="module" src="/src/astronaut/main.ts"></script>
  </body>
</html>
